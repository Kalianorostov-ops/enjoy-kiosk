name: Сборка Enjoy Kiosk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Сборка APK
        env:
          KIOSK_KEYSTORE_FILE: ${{ github.workspace }}/signing/enjoy.jks
          KIOSK_KEYSTORE_PASSWORD: ${{ secrets.KIOSK_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KIOSK_KEYSTORE_PASSWORD" ]; then echo "::warning::Нет секрета KIOSK_KEYSTORE_PASSWORD — сборка будет с отладочной подписью"; fi
          gradle --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk enjoy-kiosk.apk
          # контрольная сумма подписи — нужна для QR-кода автонастройки планшета
          if [ -n "$KIOSK_KEYSTORE_PASSWORD" ]; then
            keytool -exportcert -alias enjoy -keystore "$KIOSK_KEYSTORE_FILE" -storepass "$KIOSK_KEYSTORE_PASSWORD" | openssl dgst -binary -sha256 | openssl base64 | tr '+/' '-_' | tr -d '=' > signature.txt
          else
            echo "debug" > signature.txt
          fi
          echo "Подпись (для QR): $(cat signature.txt)"
          sha256sum enjoy-kiosk.apk | cut -d' ' -f1 | xxd -r -p | openssl base64 | tr '+/' '-_' | tr -d '=' > apk-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: enjoy-kiosk
          path: |
            enjoy-kiosk.apk
            signature.txt
            apk-sha256.txt

      - name: Выпуск (ссылка для скачивания на планшет)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Enjoy Kiosk 1.0.${{ github.run_number }}
          make_latest: true
          files: |
            enjoy-kiosk.apk
            signature.txt
